[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hap-work-recorder"
version = "0.1.0"
description = "Local append-only HAP work lifecycle recorder with hash-chained JSONL events"
readme = "docs/WORK-RECORDER-INSTALL.md"
requires-python = ">=3.10"
license = { text = "Private project / not yet licensed for redistribution" }
dependencies = []

[project.scripts]
hap-worklog = "hap_work_recorder.cli:main"

[tool.setuptools]
packages = ["hap_work_recorder"]
