name: HAP evidence metadata and test validation

on:
  push:
    branches: [main]
    paths:
      - "evidence/register/**"
      - "evidence/manifests/**"
      - "scripts/**"
      - "hap_work_recorder/**"
      - "hap_data_prep/**"
      - "schemas/**"
      - "docs/AI-MEMORY-DATA-PREPARATION-RESEARCH.md"
      - "docs/CENTRAL-DATA-COLLECTION-ADAPTER.md"
      - "pyproject.toml"
      - "docs/WORK-RECORDER-INSTALL.md"
      - "tests/**"
      - ".github/workflows/hap-evidence-validation.yml"
  pull_request:
    paths:
      - "evidence/register/**"
      - "evidence/manifests/**"
      - "scripts/**"
      - "hap_work_recorder/**"
      - "hap_data_prep/**"
      - "schemas/**"
      - "docs/AI-MEMORY-DATA-PREPARATION-RESEARCH.md"
      - "docs/CENTRAL-DATA-COLLECTION-ADAPTER.md"
      - "pyproject.toml"
      - "docs/WORK-RECORDER-INSTALL.md"
      - "tests/**"
      - ".github/workflows/hap-evidence-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixed HAP verification suite
        run: python scripts/run_hap_tests.py --report "$RUNNER_TEMP/hap-test-report.json"
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hap-test-report
          path: ${{ runner.temp }}/hap-test-report.json
          if-no-files-found: warn
          retention-days: 14
